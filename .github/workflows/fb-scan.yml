name: Facebook track scan

on:
  schedule:
    # 8:00 / 12:00 / 2:00 PM MT (± few min) — offset minutes avoid GitHub's
    # top-of-hour schedule stampede (jobs at :00 UTC are often delayed/dropped).
    - cron: '17 8 * * *'
      timezone: America/Denver
    - cron: '23 12 * * *'
      timezone: America/Denver
    - cron: '31 14 * * *'
      timezone: America/Denver
  workflow_dispatch:

concurrency:
  group: fb-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Random startup jitter (don't hit FB at exact cron time)
        run: |
          DELAY=$((RANDOM % 241))
          echo "Sleeping ${DELAY}s before scan"
          sleep "$DELAY"

      - name: Scan Facebook track pages
        env:
          FB_COOKIE: ${{ secrets.FB_COOKIE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TZ: America/Denver
        run: |
          echo "::add-mask::$FB_COOKIE"
          npx tsx scripts/scanFbDirect.ts

      - name: Refresh FB_COOKIE secret with rotated session cookies
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.COOKIE_SYNC_PAT }}
        run: |
          if [ -f scripts/output/.fb-cookie-next ]; then
            gh secret set FB_COOKIE < scripts/output/.fb-cookie-next
            echo "FB_COOKIE secret updated with rotated cookies"
          else
            echo "No cookie rotation this run"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fb-scan-output
          path: scripts/output/latest-social-metadata.json
          if-no-files-found: ignore
          retention-days: 14
